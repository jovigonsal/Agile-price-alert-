name: Agile Price Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agile-price-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check Agile prices
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone, timedelta
          from zoneinfo import ZoneInfo

          API = "https://api.octopus.energy/v1"

          CHEAP = 10.0
          VERY_CHEAP = 5.0
          EXPENSIVE = 30.0
          VERY_EXPENSIVE = 40.0

          REGION = "_L"
          LOCAL_ZONE = ZoneInfo("Europe/London")

          topic = os.environ.get("NTFY_TOPIC", "").strip()

          if not topic:
              raise RuntimeError("NTFY_TOPIC secret is not configured.")

          def get_json(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Agile-Price-Alert/1.0"
                  },
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:
                  return json.load(response)

          def notify(
              title,
              message,
              priority="default",
              tags="electric_plug"
          ):
              url = f"https://ntfy.sh/{topic}"

              # HTTP headers must be ASCII-safe.
              # Emoji remain safely inside the UTF-8 message body.
              safe_title = (
                  title
                  .replace("🔴", "")
                  .replace("🟠", "")
                  .replace("🟢", "")
                  .replace("🔥", "")
                  .replace("⚡", "")
                  .replace("—", "-")
                  .strip()
              )

              safe_title = (
                  safe_title
                  .encode("ascii", "ignore")
                  .decode("ascii")
              )

              request = urllib.request.Request(
                  url,
                  data=message.encode("utf-8"),
                  method="POST",
                  headers={
                      "Title": safe_title,
                      "Priority": priority,
                      "Tags": tags,
                  },
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:
                  print(
                      f"Notification sent: HTTP {response.status}"
                  )

          def time_text(iso_string):
              dt = datetime.fromisoformat(
                  iso_string.replace("Z", "+00:00")
              )
              return dt.astimezone(
                  LOCAL_ZONE
              ).strftime("%H:%M")

          # Find active Agile products.
          products = get_json(
              f"{API}/products/?brand=OCTOPUS_ENERGY&is_business=false"
          )["results"]

          candidates = []

          for product in products:
              if product.get("display_name") != "Agile Octopus":
                  continue

              if product.get("is_business") is not False:
                  continue

              if product.get("available_to") is not None:
                  continue

              candidates.append(product)

          candidates.sort(
              key=lambda p: p.get("available_from") or "",
              reverse=True
          )

          product = None
          product_detail = None

          # Find an active Agile product containing region _L.
          for candidate in candidates:
              try:
                  detail = get_json(
                      f"{API}/products/{candidate['code']}/"
                  )

                  tariffs = detail.get(
                      "single_register_electricity_tariffs",
                      {}
                  )

                  if "_L" in tariffs or "L" in tariffs:
                      product = candidate
                      product_detail = detail
                      break

              except Exception as error:
                  print(
                      f"Could not inspect "
                      f"{candidate.get('code')}: {error}"
                  )

          if product is None:
              raise RuntimeError(
                  "Could not find an active Agile product "
                  "containing electricity region _L."
              )

          product_code = product["code"]

          tariffs = product_detail[
              "single_register_electricity_tariffs"
          ]

          region = (
              tariffs.get("_L")
              or tariffs.get("L")
          )

          if region is None:
              raise RuntimeError(
                  "Agile product does not contain electricity region _L."
              )

          # Select Direct Debit tariff.
          tariff_info = region.get(
              "direct_debit_monthly"
          )

          if tariff_info is None:
              raise RuntimeError(
                  "Could not find Direct Debit Agile tariff."
              )

          tariff_code = tariff_info["code"]

          print(f"Agile product: {product_code}")
          print(f"Agile tariff: {tariff_code}")

          # Get current and next 48 hours.
          now = datetime.now(
              timezone.utc
          ).replace(
              second=0,
              microsecond=0
          )

          start = now - timedelta(minutes=30)
          end = now + timedelta(hours=48)

          def iso(dt):
              return dt.strftime(
                  "%Y-%m-%dT%H:%M:%SZ"
              )

          price_url = (
              f"{API}/products/{product_code}"
              f"/electricity-tariffs/{tariff_code}"
              f"/standard-unit-rates/"
              f"?period_from={iso(start)}"
              f"&period_to={iso(end)}"
          )

          prices = get_json(price_url).get(
              "results",
              []
          )

          if not prices:
              raise RuntimeError(
                  "Octopus returned no Agile prices."
              )

          prices.sort(
              key=lambda p: p["valid_from"]
          )

          # Find current half-hour.
          current = None

          for price in prices:
              valid_from = datetime.fromisoformat(
                  price["valid_from"].replace(
                      "Z",
                      "+00:00"
                  )
              )

              valid_to = price.get("valid_to")

              if valid_to:
                  valid_to = datetime.fromisoformat(
                      valid_to.replace(
                          "Z",
                          "+00:00"
                      )
                  )

              if (
                  valid_from <= now
                  and (
                      valid_to is None
                      or now < valid_to
                  )
              ):
                  current = price
                  break

          if current is None:
              raise RuntimeError(
                  "Could not identify current Agile price."
              )

          current_price = float(
              current["value_inc_vat"]
          )

          current_slot = current["valid_from"]

          print(
              f"Current Agile price: "
              f"{current_price:.2f}p/kWh"
          )

          print(
              f"Current period: "
              f"{time_text(current['valid_from'])}"
              f"-"
              f"{time_text(current['valid_to'])}"
          )
          
          # ------------------------------------------------------------
          # Daily planning reports at 06:00 and 18:00.
          # ------------------------------------------------------------

          local_now = now.astimezone(LOCAL_ZONE)
          local_hour = local_now.hour

          report_type = None

          if local_hour == 6:
              report_type = "morning"

          elif local_hour == 18:
              report_type = "evening"

          def get_price_periods(periods):
              result = []

              for price in periods:
                  value = float(price["value_inc_vat"])

                  start_dt = datetime.fromisoformat(
                      price["valid_from"].replace("Z", "+00:00")
                  )

                  end_value = price.get("valid_to")

                  if end_value:
                      end_dt = datetime.fromisoformat(
                          end_value.replace("Z", "+00:00")
                      )
                  else:
                      end_dt = start_dt + timedelta(minutes=30)

                  result.append({
                      "price": value,
                      "start": start_dt,
                      "end": end_dt,
                  })

              return result

          def format_period(period):
              start_text = period["start"].astimezone(
                  LOCAL_ZONE
              ).strftime("%H:%M")

              end_text = period["end"].astimezone(
                  LOCAL_ZONE
              ).strftime("%H:%M")

              return (
                  f"{start_text}-{end_text} "
                  f"{period['price']:.1f}p"
              )

          def find_best_window(periods, threshold):
              best = []
              current_window = []

              for period in periods:
                  if period["price"] <= threshold:
                      current_window.append(period)

                  else:
                      if len(current_window) > len(best):
                          best = current_window

                      current_window = []

              if len(current_window) > len(best):
                  best = current_window

              return best

          def send_daily_report(report_type):
              periods = get_price_periods(prices)

              if report_type == "evening":
                  # Evening report: look at tomorrow.
                  tomorrow_date = (
                      local_now.date()
                      + timedelta(days=1)
                  )

                  selected = [
                      p for p in periods
                      if p["start"].astimezone(
                          LOCAL_ZONE
                      ).date() == tomorrow_date
                  ]

                  title = "AGILE PLAN - TOMORROW"

              else:
                  # Morning report: look at today.
                  today_date = local_now.date()

                  selected = [
                      p for p in periods
                      if p["start"].astimezone(
                          LOCAL_ZONE
                      ).date() == today_date
                      and p["end"] > now
                  ]

                  title = "AGILE UPDATE - TODAY"

              if not selected:
                  print(
                      f"No price periods available for {report_type} report."
                  )
                  return

              very_cheap = [
                  p for p in selected
                  if p["price"] <= VERY_CHEAP
              ]

              cheap = [
                  p for p in selected
                  if p["price"] <= CHEAP
              ]

              reasonable = [
                  p for p in selected
                  if p["price"] <= 15.0
              ]

              cheapest = min(
                  selected,
                  key=lambda p: p["price"]
              )

              best_window = find_best_window(
                  selected,
                  CHEAP
              )

              expensive = max(
                  selected,
                  key=lambda p: p["price"]
              )

              lines = [
                  f"📊 {title}",
                  "",
                  f"🔥 Very cheap (≤5p): {len(very_cheap)} periods",
                  f"🟢 Cheap (≤10p): {len(cheap)} periods",
                  f"🟡 Reasonable (≤15p): {len(reasonable)} periods",
                  "",
                  (
                      "💰 Cheapest: "
                      f"{format_period(cheapest)}"
                  ),
                  "",
              ]

              if best_window:
                  window_start = best_window[0]["start"].astimezone(
                      LOCAL_ZONE
                  ).strftime("%H:%M")

                  window_end = best_window[-1]["end"].astimezone(
                      LOCAL_ZONE
                  ).strftime("%H:%M")

                  average_price = sum(
                      p["price"] for p in best_window
                  ) / len(best_window)

                  lines.append(
                      "🟢 Best cheap window: "
                      f"{window_start}-{window_end}"
                  )

                  lines.append(
                      f"Average: {average_price:.1f}p/kWh"
                  )

                  lines.append("")

              lines.append(
                  "🔴 Highest price: "
                  f"{format_period(expensive)}"
              )

              notify(
                  title,
                  "\n".join(lines),
                  priority="default",
                  tags="bar_chart"
              )

              print(
                  f"{report_type.capitalize()} report sent."
              )
              
          # Load previous alert state.
          state_file = "agile-alert-state.json"

          try:
              with open(
                  state_file,
                  "r"
              ) as file:
                  state = json.load(file)

          except Exception:
              state = {}

          # Send the 06:00 or 18:00 planning report once only.
          if report_type:
              report_key = (
                  f"{report_type}:{local_now.date()}"
              )

              if state.get("last_daily_report") != report_key:
                  send_daily_report(report_type)

                  state["last_daily_report"] = report_key

                  print(
                      f"Saved daily report state: {report_key}"
                  )
                  
          # ------------------------------------------------------------
          # Price category alerts.
          # Only notify when the price moves into a different category.
          # ------------------------------------------------------------

          def price_category(price):
              if price < 0:
                  return "negative"

              if price <= 10:
                  return "very_cheap"

              if price <= 20:
                  return "cheap"

              if price <= 29:
                  return "normal"

              if price <= 40:
                  return "expensive"

              return "very_expensive"


          current_category = price_category(current_price)
          previous_category = state.get("last_price_category")


          # Only send a notification when the category changes.
          if current_category != previous_category:

              if current_category == "negative":

                  notify(
                      "NEGATIVE AGILE PRICE",
                      (
                          f"⚡ Current price: "
                          f"{current_price:.1f}p/kWh.\n\n"
                          "Electricity is below 0p/kWh."
                      ),
                      priority="high",
                      tags="zap,moneybag"
                  )


              elif current_category == "very_cheap":

                  notify(
                      "VERY CHEAP AGILE PRICE",
                      (
                          f"🔥 Current price: "
                          f"{current_price:.1f}p/kWh.\n\n"
                          "Excellent time for flexible "
                          "electricity use."
                      ),
                      priority="high",
                      tags="fire,electric_plug"
                  )


              elif current_category == "cheap":

                  notify(
                      "CHEAP AGILE PRICE",
                      (
                          f"🟢 Current price: "
                          f"{current_price:.1f}p/kWh.\n\n"
                          "Good time for flexible "
                          "electricity use."
                      ),
                      priority="default",
                      tags="green_circle,electric_plug"
                  )


              elif current_category == "normal":

                  notify(
                      "NORMAL AGILE PRICE",
                      (
                          f"Current price: "
                          f"{current_price:.1f}p/kWh.\n\n"
                          "Electricity is in the normal "
                          "price range."
                      ),
                      priority="default",
                      tags="electric_plug"
                  )


              elif current_category == "expensive":

                  notify(
                      "EXPENSIVE AGILE PRICE",
                      (
                          f"🟠 Current price: "
                          f"{current_price:.1f}p/kWh.\n\n"
                          "Consider delaying flexible "
                          "electricity use if practical."
                      ),
                      priority="default",
                      tags="warning"
                  )


              elif current_category == "very_expensive":

                  notify(
                      "VERY EXPENSIVE - LIMIT USE",
                      (
                          f"🔴 Current price: "
                          f"{current_price:.1f}p/kWh.\n\n"
                          "Price is above 40p/kWh. "
                          "Limit unnecessary electricity use."
                      ),
                      priority="high",
                      tags="warning,rotating_light"
                  )


              state["last_price_category"] = current_category

              print(
                  f"Price category changed: "
                  f"{previous_category} -> {current_category}"
              )

          else:

              print(
                  f"Price category unchanged: "
                  f"{current_category}"
              )

          # Save current state.
          state["last_price"] = current_price
          state["last_checked"] = now.isoformat()
          state["product"] = product_code
          state["tariff"] = tariff_code

          with open(
              state_file,
              "w"
          ) as file:
              json.dump(
                  state,
                  file,
                  indent=2
              )

          print(
              "Agile Price Monitor completed successfully."
          )
          PY

      - name: Save alert state
        run: |
          if git diff --quiet -- agile-alert-state.json; then
            echo "No state change."
            exit 0
          fi

          git config user.name "Agile Price Alert"
          git config user.email "agile-price-alert@users.noreply.github.com"

          git add agile-alert-state.json
          git commit -m "Update Agile alert state"
          git push
