name: Agile Price Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agile-price-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check Agile prices
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone, timedelta
          from zoneinfo import ZoneInfo

          API = "https://api.octopus.energy/v1"

          CHEAP = 10.0
          VERY_CHEAP = 5.0
          EXPENSIVE = 30.0
          VERY_EXPENSIVE = 40.0

          REGION = "_L"
          LOCAL_ZONE = ZoneInfo("Europe/London")

          topic = os.environ.get("NTFY_TOPIC", "").strip()

          if not topic:
              raise RuntimeError("NTFY_TOPIC secret is not configured.")


          def get_json(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Agile-Price-Alert/1.0"
                  },
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:
                  return json.load(response)


          def notify(title, message, priority="default", tags="electric_plug"):
              url = f"https://ntfy.sh/{topic}"

              request = urllib.request.Request(
                  url,
                  data=message.encode("utf-8"),
                  method="POST",
                  headers={
                      "Title": title,
                      "Priority": priority,
                      "Tags": tags,
                  },
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:
                  print(f"Notification sent: HTTP {response.status}")


          def time_text(iso_string):
              dt = datetime.fromisoformat(
                  iso_string.replace("Z", "+00:00")
              )
              return dt.astimezone(LOCAL_ZONE).strftime("%H:%M")


          # Find active Agile products.
          products = get_json(
              f"{API}/products/?brand=OCTOPUS_ENERGY&is_business=false"
          )["results"]

          candidates = []

          for product in products:
              if product.get("display_name") != "Agile Octopus":
                  continue

              if product.get("is_business") is not False:
                  continue

              if product.get("available_to") is not None:
                  continue

              candidates.append(product)


          candidates.sort(
              key=lambda p: p.get("available_from") or "",
              reverse=True
          )


          product = None
          product_detail = None

          # Find an active Agile product containing region _L.
          for candidate in candidates:
              try:
                  detail = get_json(
                      f"{API}/products/{candidate['code']}/"
                  )

                  tariffs = detail.get(
                      "single_register_electricity_tariffs",
                      {}
                  )

                  if "_L" in tariffs or "L" in tariffs:
                      product = candidate
                      product_detail = detail
                      break

              except Exception as error:
                  print(
                      f"Could not inspect "
                      f"{candidate.get('code')}: {error}"
                  )


          if product is None:
              raise RuntimeError(
                  "Could not find an active Agile product "
                  "containing electricity region _L."
              )


          product_code = product["code"]

          tariffs = product_detail[
              "single_register_electricity_tariffs"
          ]

          region = (
              tariffs.get("_L")
              or tariffs.get("L")
          )


          if region is None:
              raise RuntimeError(
                  "Agile product does not contain electricity region _L."
              )


          # Select Direct Debit tariff.
          tariff_info = region.get(
              "direct_debit_monthly"
          )


          if tariff_info is None:
              raise RuntimeError(
                  "Could not find Direct Debit Agile tariff."
              )


          tariff_code = tariff_info["code"]


          print(f"Agile product: {product_code}")
          print(f"Agile tariff: {tariff_code}")


          # Get current and next 24 hours.
          now = datetime.now(
              timezone.utc
          ).replace(
              second=0,
              microsecond=0
          )

          start = now - timedelta(minutes=30)
          end = now + timedelta(hours=24)


          def iso(dt):
              return dt.strftime("%Y-%m-%dT%H:%M:%SZ")


          price_url = (
              f"{API}/products/{product_code}"
              f"/electricity-tariffs/{tariff_code}"
              f"/standard-unit-rates/"
              f"?period_from={iso(start)}"
              f"&period_to={iso(end)}"
          )


          prices = get_json(price_url).get(
              "results",
              []
          )


          if not prices:
              raise RuntimeError(
                  "Octopus returned no Agile prices."
              )


          prices.sort(
              key=lambda p: p["valid_from"]
          )


          # Find current half-hour.
          current = None

          for price in prices:
              valid_from = datetime.fromisoformat(
                  price["valid_from"].replace(
                      "Z",
                      "+00:00"
                  )
              )

              valid_to = price.get("valid_to")

              if valid_to:
                  valid_to = datetime.fromisoformat(
                      valid_to.replace(
                          "Z",
                          "+00:00"
                      )
                  )

              if (
                  valid_from <= now
                  and (
                      valid_to is None
                      or now < valid_to
                  )
              ):
                  current = price
                  break


          if current is None:
              raise RuntimeError(
                  "Could not identify current Agile price."
              )


          current_price = float(
              current["value_inc_vat"]
          )

          current_slot = current["valid_from"]


          print(
              f"Current Agile price: "
              f"{current_price:.2f}p/kWh"
          )

          print(
              f"Current period: "
              f"{time_text(current['valid_from'])}"
              f"-"
              f"{time_text(current['valid_to'])}"
          )


          # Load previous alert state.
          state_file = "agile-alert-state.json"

          try:
              with open(
                  state_file,
                  "r"
              ) as file:
                  state = json.load(file)

          except Exception:
              state = {}


          # VERY EXPENSIVE >40p.
          if current_price > VERY_EXPENSIVE:

              if (
                  state.get("very_expensive_slot")
                  != current_slot
              ):

                  notify(
                      "🔴 VERY EXPENSIVE — LIMIT USE",
                      (
                          f"Agile electricity is "
                          f"{current_price:.1f}p/kWh now.\n\n"
                          "Price is above 40p/kWh. "
                          "Limit unnecessary electricity use."
                      ),
                      priority="high",
                      tags="warning,rotating_light"
                  )

                  state[
                      "very_expensive_slot"
                  ] = current_slot


          # EXPENSIVE >30p.
          elif current_price > EXPENSIVE:

              if (
                  state.get("expensive_slot")
                  != current_slot
              ):

                  notify(
                      "🟠 EXPENSIVE AGILE PRICE",
                      (
                          f"Current price: "
                          f"{current_price:.1f}p/kWh.\n\n"
                          "Consider delaying flexible "
                          "electricity use if practical."
                      ),
                      priority="default",
                      tags="warning"
                  )

                  state[
                      "expensive_slot"
                  ] = current_slot


          # NEGATIVE PRICE.
          if current_price < 0:

              if (
                  state.get("negative_slot")
                  != current_slot
              ):

                  notify(
                      "⚡ NEGATIVE AGILE PRICE",
                      (
                          f"Current price: "
                          f"{current_price:.1f}p/kWh.\n\n"
                          "This is a negative-price period."
                      ),
                      priority="high",
                      tags="zap,moneybag"
                  )

                  state[
                      "negative_slot"
                  ] = current_slot


          # VERY CHEAP <=5p.
          elif current_price <= VERY_CHEAP:

              if (
                  state.get("very_cheap_slot")
                  != current_slot
              ):

                  notify(
                      "🔥 VERY CHEAP AGILE PRICE",
                      (
                          f"Current price: "
                          f"{current_price:.1f}p/kWh.\n\n"
                          "Excellent time for flexible "
                          "electricity use."
                      ),
                      priority="high",
                      tags="fire,electric_plug"
                  )

                  state[
                      "very_cheap_slot"
                  ] = current_slot


          # CHEAP <=10p.
          elif current_price <= CHEAP:

              if (
                  state.get("cheap_slot")
                  != current_slot
              ):

                  notify(
                      "🟢 CHEAP AGILE PRICE",
                      (
                          f"Current price: "
                          f"{current_price:.1f}p/kWh.\n\n"
                          "Good time for flexible "
                          "electricity use."
                      ),
                      priority="default",
                      tags="green_circle,electric_plug"
                  )

                  state[
                      "cheap_slot"
                  ] = current_slot


          # Save current state.
          state["last_price"] = current_price
          state["last_checked"] = now.isoformat()
          state["product"] = product_code
          state["tariff"] = tariff_code

          with open(
              state_file,
              "w"
          ) as file:
              json.dump(
                  state,
                  file,
                  indent=2
              )


          print("Agile Price Monitor completed successfully.")
          PY

      - name: Save alert state
        run: |
          if git diff --quiet -- agile-alert-state.json; then
            echo "No state change."
            exit 0
          fi

          git config user.name "Agile Price Alert"
          git config user.email "agile-price-alert@users.noreply.github.com"

          git add agile-alert-state.json
          git commit -m "Update Agile alert state"
          git push
