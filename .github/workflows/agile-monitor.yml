name: Agile Price Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agile-price-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check Agile prices
        env:
          NTFY_TOPIC: agile-jovi-7x4k92
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone, timedelta

          API = "https://api.octopus.energy/v1"

          CHEAP = 10.0
          VERY_CHEAP = 5.0
          EXPENSIVE = 30.0
          VERY_EXPENSIVE = 40.0

          topic = os.environ["NTFY_TOPIC"]

          def get_json(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Agile-Price-Alert/1.0"}
              )
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.load(r)

          def notify(title, message, priority="default", tags="electric_plug"):
              url = f"https://ntfy.sh/{topic}"
              data = message.encode("utf-8")

              req = urllib.request.Request(
                  url,
                  data=data,
                  method="POST",
                  headers={
                      "Title": title,
                      "Priority": priority,
                      "Tags": tags,
                  },
              )

              with urllib.request.urlopen(req, timeout=20) as r:
                  print("Notification sent:", r.status)

          # Discover the currently active Agile product.
          products = get_json(
              f"{API}/products/?brand=OCTOPUS_ENERGY"
          )["results"]

          agile = [
              p for p in products
              if "Agile Octopus" in p.get("display_name", "")
              and p.get("is_business") is False
              and p.get("available_to") is None
          ]

          if not agile:
              raise RuntimeError("Could not find an active Agile Octopus product.")

          agile.sort(
              key=lambda p: p.get("available_from") or "",
              reverse=True
          )

          product = agile[0]
          product_code = product["code"]

          # Your electricity region is L.
          product_detail = get_json(
              f"{API}/products/{product_code}/"
          )

          tariffs = product_detail["single_register_electricity_tariffs"]

          region = tariffs.get("_L") or tariffs.get("L")
          
          if region is None:
                 raise RuntimeError("Agile product does not contain electricity region L."
  


          # Prefer direct debit, otherwise use the first available tariff.
          tariff_info = (
              region.get("direct_debit_monthly")
              or next(iter(region.values()))
          )

          tariff_code = tariff_info["code"]

          # Get prices around now and into tomorrow.
          now = datetime.now(timezone.utc).replace(second=0, microsecond=0)
          start = now - timedelta(minutes=30)
          end = now + timedelta(hours=24)

          def iso(dt):
              return dt.strftime("%Y-%m-%dT%H:%M:%SZ")

          price_url = (
              f"{API}/products/{product_code}"
              f"/electricity-tariffs/{tariff_code}"
              f"/standard-unit-rates/"
              f"?period_from={iso(start)}"
              f"&period_to={iso(end)}"
          )

          prices = get_json(price_url)["results"]

          if not prices:
              raise RuntimeError("No Agile prices returned.")

          prices.sort(key=lambda x: x["valid_from"])

          current = None
          for p in prices:
              vf = datetime.fromisoformat(
                  p["valid_from"].replace("Z", "+00:00")
              )
              vt = p.get("valid_to")
              vt = (
                  datetime.fromisoformat(vt.replace("Z", "+00:00"))
                  if vt else None
              )

              if vf <= now and (vt is None or now < vt):
                  current = p
                  break

          if current is None:
              current = prices[0]

          current_price = float(current["value_inc_vat"])

          # Find a useful continuous cheap window of at least 1 hour.
          cheap_slots = [
              p for p in prices
              if float(p["value_inc_vat"]) <= CHEAP
          ]

          best_window = None

          for i in range(len(prices)):
              start_p = prices[i]
              if float(start_p["value_inc_vat"]) > CHEAP:
                  continue

              end_i = i
              while (
                  end_i + 1 < len(prices)
                  and float(prices[end_i + 1]["value_inc_vat"]) <= CHEAP
              ):
                  end_i += 1

              if end_i - i + 1 >= 2:
                  window = prices[i:end_i + 1]
                  avg = sum(
                      float(x["value_inc_vat"]) for x in window
                  ) / len(window)

                  candidate = {
                      "start": window[0]["valid_from"],
                      "end": window[-1]["valid_to"],
                      "average": avg,
                      "lowest": min(
                          float(x["value_inc_vat"]) for x in window
                      ),
                  }

                  if best_window is None or candidate["average"] < best_window["average"]:
                      best_window = candidate

          # Persistent state.
          state_file = "agile-alert-state.json"

          try:
              with open(state_file, "r") as f:
                  state = json.load(f)
          except Exception:
              state = {}

          # Identify the current half-hour slot.
          current_slot = current["valid_from"]

          # 1. Very expensive warning (>40p).
          if current_price > VERY_EXPENSIVE:
              if state.get("very_expensive_slot") != current_slot:
                  notify(
                      "🔴 VERY EXPENSIVE — LIMIT USE",
                      f"Agile electricity is {current_price:.1f}p/kWh now.\n\n"
                      f"Try to avoid unnecessary electricity use until the price falls below 40p/kWh.",
                      priority="high",
                      tags="warning,rotating_light"
                  )
                  state["very_expensive_slot"] = current_slot

          # 2. Very cheap / negative price alert.
          if current_price < 0:
              if state.get("negative_slot") != current_slot:
                  notify(
                      "⚡ NEGATIVE AGILE PRICE",
                      f"Current price: {current_price:.1f}p/kWh.\n\n"
                      f"This is a negative-price period. If useful, consider running flexible appliances now.",
                      priority="high",
                      tags="zap,moneybag"
                  )
                  state["negative_slot"] = current_slot

          elif current_price <= VERY_CHEAP:
              if state.get("very_cheap_slot") != current_slot:
                  notify(
                      "🔥 VERY CHEAP AGILE PRICE",
                      f"Current price: {current_price:.1f}p/kWh.\n\n"
                      f"Good time for flexible electricity use.",
                      priority="high",
                      tags="fire,electric_plug"
                  )
                  state["very_cheap_slot"] = current_slot

          # 3. Cheap upcoming window alert.
          if best_window:
              window_start = datetime.fromisoformat(
                  best_window["start"].replace("Z", "+00:00")
              )

              minutes_until = (window_start - now).total_seconds() / 60

              # Alert when the useful cheap window is 0–30 minutes away.
              window_key = best_window["start"]

              if 0 <= minutes_until <= 30:
                  if state.get("cheap_window") != window_key:
                      notify(
                          "🟢 CHEAP ELECTRICITY COMING UP",
                          f"Starts in about {max(0, int(minutes_until))} minutes.\n\n"
                          f"Average: {best_window['average']:.1f}p/kWh\n"
                          f"Lowest: {best_window['lowest']:.1f}p/kWh\n\n"
                          f"Good time for washing machine, dishwasher or other flexible use.",
                          priority="default",
                          tags="green_circle,electric_plug"
                      )
                      state["cheap_window"] = window_key

          # Save state.
          state["last_price"] = current_price
          state["last_checked"] = now.isoformat()

          with open(state_file, "w") as f:
              json.dump(state, f, indent=2)

          print(
              f"Current Agile price: {current_price:.2f}p/kWh"
          )
          print(
              f"Product: {product_code}"
          )
          print(
              f"Tariff: {tariff_code}"
          )
          PY

      - name: Save alert state
        run: |
          if git diff --quiet -- agile-alert-state.json; then
            echo "No state change."
            exit 0
          fi

          git config user.name "Agile Price Alert"
          git config user.email "agile-price-alert@users.noreply.github.com"

          git add agile-alert-state.json
          git commit -m "Update Agile alert state"
          git push
