<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>Agile Price Alert</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:#f3f4f6;color:#111827}main{max-width:680px;margin:auto;padding:24px 18px 40px}.card{background:white;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 2px 12px #00000010}.price{font-size:52px;font-weight:800}.badge{display:inline-block;padding:7px 11px;border-radius:999px;font-weight:700}.cheap{background:#dcfce7}.normal{background:#e5e7eb}.exp{background:#fee2e2}.very{background:#fecaca}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}button{width:100%;padding:14px;border:0;border-radius:14px;background:#111827;color:#fff;font-size:16px;font-weight:700}small{color:#6b7280}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:12px;margin:5px 0 12px;font-size:16px}</style></head><body><main><h1>⚡ Agile Price Alert</h1><div class="card"><small>Current Agile price</small><div id="price" class="price">—</div><div id="status" class="badge normal">Loading…</div><p id="valid">—</p></div><div class="card"><h2>Next cheap window</h2><div id="window">—</div></div><div class="card"><h2>Notifications</h2><p>Get an alert before a useful cheap period starts.</p><button id="notify">Enable notifications</button></div><div class="card"><h2>Alert settings</h2><label>Cheap threshold (p/kWh)<input id="cheap" type="number" value="10" step="0.1"></label><label>Very expensive threshold (p/kWh)<input id="very" type="number" value="40" step="0.1"></label><small>Rules: ≤5 very cheap · ≤10 cheap · ≤15 reasonable · >30 expensive · >40 very expensive — limit use.</small></div><div class="card"><h2>Today's prices</h2><div id="list">Loading…</div></div></main><script>let prices=[];const $=id=>document.getElementById(id);function cls(p){if(p>40)return['very','🔴 Very expensive — limit use'];if(p>30)return['exp','🟠 Expensive'];if(p<=5)return['cheap','🔥 Very cheap'];if(p<=10)return['cheap','🟢 Cheap'];if(p<=15)return['cheap','🟢 Reasonable'];return['normal','⚪ Normal']}function fmt(d){return new Date(d).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}async function load(){try{const now=new Date(),from=new Date(now.getTime()-30*60000),to=new Date(now.getTime()+24*3600000);const u=`https://api.octopus.energy/v1/products/?brand=OCTOPUS_ENERGY&is_variable=true&page_size=100`;let ps=(await (await fetch(u)).json()).results.filter(x=>/agile/i.test(x.display_name||'')&&x.is_variable&&!x.is_business);ps.sort((a,b)=>new Date(b.available_from)-new Date(a.available_from));let p=ps[0];let details=await (await fetch(`https://api.octopus.energy/v1/products/${p.code}/`)).json();let t=details.single_register_electricity_tariffs;let codes=[];Object.values(t||{}).forEach(v=>Object.values(v||{}).forEach(x=>{if(x.direct_debit_monthly?.code)codes.push(x.direct_debit_monthly.code);if(x.code)codes.push(x.code)}));let code=codes.find(x=>/-[A-Z]$/.test(x))||codes[0];let url=`https://api.octopus.energy/v1/products/${p.code}/electricity-tariffs/${code}/standard-unit-rates/?period_from=${encodeURIComponent(from.toISOString())}&period_to=${encodeURIComponent(to.toISOString())}`;prices=(await (await fetch(url)).json()).results.map(x=>({...x,p:x.value_inc_vat})).sort((a,b)=>new Date(a.valid_from)-new Date(b.valid_from));render()}catch(e){$('price').textContent='Error';$('valid').textContent=e.message}}function render(){if(!prices.length)return;let now=Date.now(),cur=prices.find(x=>new Date(x.valid_from)<=now&&(!x.valid_to||new Date(x.valid_to)>now))||prices[0];let [c,s]=cls(cur.p);$('price').textContent=cur.p.toFixed(1)+'p';$('status').className='badge '+c;$('status').textContent=s;$('valid').textContent=fmt(cur.valid_from)+'–'+fmt(cur.valid_to);let cheap=prices.filter(x=>x.p<=Number($('cheap').value));let best=cheap.sort((a,b)=>a.p-b.p)[0];$('window').textContent=best?`${fmt(best.valid_from)}–${fmt(best.valid_to)} · ${best.p.toFixed(1)}p/kWh`:'No cheap period found';$('list').innerHTML=prices.slice(0,30).map(x=>{let [cc,ss]=cls(x.p);return `<div class="row"><span>${fmt(x.valid_from)}</span><b>${x.p.toFixed(1)}p</b><span class="badge ${cc}">${ss}</span></div>`}).join('');} $('notify').onclick=async()=>{if(!('Notification'in window)){alert('Notifications are not supported here. Add this site to the Home Screen first, then open it from the icon.');return}let p=await Notification.requestPermission();$('notify').textContent=p==='granted'?'Notifications enabled':'Notifications not enabled'};load();setInterval(load,5*60000);$('cheap').onchange=render;$('very').onchange=render;</script></body></html>
